<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenCoyote-Bay — Stakeholder Portal</title>
  <meta name="description" content="Persona-oriented narrative portal for the GreenCoyote-Bay (GCB / ODIN_Bridge) photonic inference fabric program." />

  <link rel="stylesheet" href="styles.css" />

  <!-- KaTeX (math typesetting) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>

  <!-- marked (Markdown -> HTML) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

  <!-- Mermaid (diagrams) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">GreenCoyote-Bay</span>
      <span class="brand-sub">Stakeholder Portal</span>
    </div>
    <nav class="controls" aria-label="Document navigation">
      <label class="audience-label" for="document-select">I am a…</label>
      <select id="document-select" aria-label="Choose your lens or saga"></select>
      <div class="depth-toggle" role="group" aria-label="Reading depth">
        <button type="button" data-depth="executive" class="active" aria-pressed="true">Executive</button>
        <button type="button" data-depth="system" aria-pressed="false">System</button>
        <button type="button" data-depth="foundry" aria-pressed="false">Foundry</button>
      </div>
    </nav>
  </header>

  <main>
    <p id="doc-status" class="status" role="status" hidden></p>
    <article id="doc-content" class="doc-content"></article>
  </main>

  <footer class="site-footer">
    <p>
      This is a narrative retelling, not the source of truth — see
      <a href="https://github.com/jagreen03/gcb-spec" target="_blank" rel="noopener">gcb-spec</a>
      for the authoritative register map, ADRs, and RTL-adjacent specifications,
      <a href="https://github.com/jagreen03/gcb-wiki/tree/main/lenses" target="_blank" rel="noopener">lenses/</a>
      for the 4 consolidated entry points, and
      <a href="https://github.com/jagreen03/gcb-wiki/tree/main/sagas" target="_blank" rel="noopener">sagas/</a>
      for the full-depth, per-audience raw Markdown behind them.
    </p>
  </footer>

  <script type="module" src="assets/main.js"></script>
</body>
</html>
