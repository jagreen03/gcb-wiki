<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="styles.css" />

  <!-- KaTeX (math typesetting) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>

  <!-- marked (Markdown -> HTML) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.umd.min.js"></script>

</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">GreenCoyote-Bay</span>
      <span class="brand-sub">Stakeholder Sagas</span>
    </div>
    <nav class="controls" aria-label="Saga navigation">
      <label class="audience-label" for="audience-select">I am a…</label>
      <select id="audience-select" aria-label="Choose your audience"></select>
      <div class="depth-toggle" role="group" aria-label="Reading depth">
        <button type="button" data-depth="overview" class="active" aria-pressed="true">Overview</button>
        <button type="button" data-depth="full" aria-pressed="false">Full detail</button>
      </div>
    </nav>
  </header>

  <main>
    <p id="saga-status" class="status" role="status" hidden></p>
    <article id="saga-content" class="saga-content"></article>
  </main>

  <footer class="site-footer">
    <p>
      This is a narrative retelling, not the source of truth — see
      <a href="https://github.com/jagreen03/gcb-spec" target="_blank" rel="noopener">gcb-spec</a>
      for the authoritative register map, ADRs, and RTL-adjacent specifications, and
      <a href="https://github.com/jagreen03/gcb-wiki/tree/main/sagas" target="_blank" rel="noopener">sagas/</a>
      for the raw Markdown behind this page.
    </p>
  </footer>

  <script type="module" src="assets/main.js"></script>
