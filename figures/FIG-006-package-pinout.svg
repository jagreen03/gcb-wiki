<rect x="1160" y="388" width="460" height="70" rx="5" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.4"/>
<text x="1170" y="404" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="bold" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">Clock</text>
<text x="1170" y="419" font-size="8.4" text-anchor="start" fill="#54606b" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="1170" dy="0">6 GHz reference in (or on-die PLL ref);</tspan><tspan x="1170" dy="9.5">4-phase generated on-die in CML</tspan></text>
<line x1="1070" y1="260" x2="1160" y2="422" stroke="#9aa4ad" stroke-width="1"/>
<rect x="1160" y="468" width="460" height="70" rx="5" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.4"/>
<text x="1170" y="484" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="bold" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">Power</text>
<text x="1170" y="499" font-size="8.4" text-anchor="start" fill="#54606b" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="1170" dy="0">core 0.7 V (logic), 0.8 V (readout analog),</tspan><tspan x="1170" dy="9.5">photonic tuner rail, PD bias — currents TBD</tspan></text>
<line x1="1070" y1="260" x2="1160" y2="502" stroke="#9aa4ad" stroke-width="1"/>
<rect x="1160" y="548" width="460" height="70" rx="5" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.4"/>
<text x="1170" y="564" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="bold" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">Debug</text>
<text x="1170" y="579" font-size="8.4" text-anchor="start" fill="#54606b" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="1170" dy="0">JTAG / scan</tspan></text>
<line x1="1070" y1="260" x2="1160" y2="582" stroke="#9aa4ad" stroke-width="1"/>
<rect x="0" y="634" width="1620" height="46" rx="0" fill="#fff3f3" stroke="#c0392b" stroke-width="1"/>
<text x="810.0" y="654" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">PRELIMINARY CONCEPT — NO SILICON EXISTS</text>
<text x="12" y="696" font-size="9.5" text-anchor="start" fill="#54606b" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">Concept package arrangement — schematic, not to scale, not a pinout. No GCB package has been designed or fabricated. All pin counts, dimensions, voltages, and currents are TBD.</text>
