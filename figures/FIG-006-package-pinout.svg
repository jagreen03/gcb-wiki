<rect x="1160" y="228" width="460" height="70" rx="5" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.4"/>
<text x="1170" y="244" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="bold" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">Optical</text>
<text x="1170" y="259" font-size="8.4" text-anchor="start" fill="#54606b" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="1170" dy="0">WDM input fiber(s) → reduction mesh; monitor tap out</tspan></text>
<line x1="1070" y1="260" x2="1160" y2="262" stroke="#9aa4ad" stroke-width="1"/>
<rect x="1160" y="308" width="460" height="70" rx="5" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.4"/>
<text x="1170" y="324" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="bold" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">Bench loopback</text>
<text x="1170" y="339" font-size="8.4" text-anchor="start" fill="#54606b" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="1170" dy="0">parallel DAC out / SPI-SAR-ADC in</tspan><tspan x="1170" dy="9.5">(greencoyote_dac_if.sv / greencoyote_adc_if.sv)</tspan><tspan x="1170" dy="9.5">— present for bring-up, not a product datapath</tspan></text>
