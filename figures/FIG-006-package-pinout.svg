<rect x="1160" y="148" width="460" height="70" rx="5" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.4"/>
<text x="1170" y="164" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="bold" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">Host</text>
<text x="1170" y="179" font-size="8.4" text-anchor="start" fill="#54606b" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="1170" dy="0">PCIe or AXI4 to host SoC;</tspan><tspan x="1170" dy="9.5">MMIO register window (registers.yaml, 0x00–0xC0)</tspan></text>
