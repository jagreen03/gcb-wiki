<text x="320.0" y="241.0" font-size="10" text-anchor="middle" fill="#1a1a1a" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">2  silicon interposer</text>
<rect x="40" y="260" width="560" height="30" rx="3" fill="#f0f2f4" stroke="#5b6b7a" stroke-width="1.4"/>
<text x="320.0" y="279.0" font-size="10" text-anchor="middle" fill="#1a1a1a" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">1  substrate + BGA field  —  host + power balls — count TBD</text>
<text x="40" y="312" font-size="9" text-anchor="start" fill="#54606b" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">N, layer counts, thicknesses: all TBD</text>
<text x="700" y="82" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="bold" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">B — external interface groups (no pin numbers)</text>
