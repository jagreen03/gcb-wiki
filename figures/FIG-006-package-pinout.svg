<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 700" width="1620" height="700" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker><marker id="arwg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa4ad"/></marker></defs>
<rect x="0" y="0" width="1620" height="700" fill="#ffffff"/>
<text x="20" y="30" font-size="17" text-anchor="start" fill="#1a1a1a" font-weight="bold" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">FIG-006  Package / pinout  (concept — not a pinout)</text>
<text x="20" y="50" font-size="11" text-anchor="start" fill="#54606b" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">Schematic, not to scale. No pin count, ball map, footprint or package size is defined. All values TBD.</text>
<text x="40" y="82" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="bold" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">A — package cross-section (schematic, not to scale)</text>
<rect x="40" y="100" width="560" height="34" rx="3" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.4"/>
<text x="320.0" y="121.0" font-size="10" text-anchor="middle" fill="#1a1a1a" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">5  lid / heat spreader over the pilot die  —  thermal path; photonic die near-isothermal (ADR-001)</text>
<rect x="40" y="144" width="274.0" height="70" rx="3" fill="#e6f4ee" stroke="#1b7f5b" stroke-width="1.4"/>
<text x="50" y="166" font-size="9.2" text-anchor="start" fill="#1a1a1a" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="50" dy="0">3  pilot die (FPGA/ASIC)</tspan><tspan x="50" dy="12">digital + single-slope readout + MMIO</tspan></text>
<rect x="326.0" y="144" width="274.0" height="70" rx="3" fill="#eef2f5" stroke="#5b6b7a" stroke-width="1.4"/>
<text x="336.0" y="166" font-size="9.2" text-anchor="start" fill="#1a1a1a" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="336.0" dy="0">3  photonic die</tspan><tspan x="336.0" dy="12">MZ reduction mesh, PDs, thermal tuners</tspan></text>
<rect x="592" y="158" width="44" height="42" rx="3" fill="#fbf1dc" stroke="#b8860b" stroke-width="1.4"/>
<text x="640" y="156" font-size="9" text-anchor="start" fill="#7a5c00" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">4  WDM fiber ribbon, N lanes — N TBD</text>
