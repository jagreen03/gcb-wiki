<text x="120" y="470" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="bold" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">Secondary rejected decisions (see DECISION_LEDGER.md):</text>
<text x="128" y="492" font-size="9.6" text-anchor="start" fill="#54606b" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">✗  10-bit quantization — crest-factor failure</text>
<text x="128" y="508" font-size="9.6" text-anchor="start" fill="#54606b" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">✗  CDS — −1.7 dB (comparator dominates kT/C and 1/f)</text>
<text x="128" y="524" font-size="9.6" text-anchor="start" fill="#54606b" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">✗  300 MHz PD chopper — cyclostationary mixer</text>
<text x="128" y="540" font-size="9.6" text-anchor="start" fill="#54606b" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">✗  DAC ramp ≤4-pt cal — scoring artifact (42 dB vs 58 dB)</text>
<text x="128" y="556" font-size="9.6" text-anchor="start" fill="#54606b" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">✗  1 pF C_int — rail collision</text>
<text x="128" y="572" font-size="9.6" text-anchor="start" fill="#54606b" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">✗  15 µA comparator tail — settling time</text>
<text x="128" y="588" font-size="9.6" text-anchor="start" fill="#54606b" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">✗  ripple-carry Gray counter — SS/125 °C timing</text>
<text x="128" y="604" font-size="9.6" text-anchor="start" fill="#54606b" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">✗  Xyce via conda — Trilinos missing NOX/LOCA</text>
