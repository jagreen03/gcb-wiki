<text x="12" y="896" font-size="9.4" text-anchor="start" fill="#54606b" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">Architecture decision tree for the GCB receiver. Kill reasons are specific to the GCB operating point (0.8 V, 256 ns, crest 6, 56 dB target). Mirrors DECISION_LEDGER.md; the accepted path is CONDITIONAL GO pending a commercial transient-noise histogram.</text>
