<text x="1018" y="434" font-size="8.8" text-anchor="start" fill="#1a1a1a" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="1018" dy="0">2.0 pF C_int, discharge mode</tspan><tspan x="1018" dy="10.5">cascode NMOS sink + replica servo ramp</tspan><tspan x="1018" dy="10.5">chopped/AZ preamp, I_tail 30 µA</tspan><tspan x="1018" dy="10.5">12-bit, 6 GHz ×4-phase Gray TDC</tspan><tspan x="1018" dy="10.5">3-point (quadratic) calibration</tspan><tspan x="1018" dy="10.5">carry-select counter · CML clock · static CMOS logic</tspan></text>
