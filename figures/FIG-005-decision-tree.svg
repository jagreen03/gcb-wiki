<text x="898" y="330" font-size="8.8" text-anchor="start" fill="#1a1a1a" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="898" dy="0">0.72 V ramp top from the 0.8 V rail:</tspan><tspan x="898" dy="10.5">&lt; 80 mV, cannot cascode</tspan><tspan x="898" dy="10.5">→ ramp_inl_reverse = 1</tspan></text>
