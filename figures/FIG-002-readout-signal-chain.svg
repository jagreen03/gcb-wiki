<text x="449" y="190" font-size="9.6" text-anchor="start" fill="#1a1a1a" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="449" dy="0">cascode NMOS sink + replica servo</tspan><tspan x="449" dy="12.5">falling · 4.2 mV/ns</tspan><tspan x="449" dy="12.5">0.20–0.77 V</tspan><tspan x="449" dy="12.5">slope ±1.1 % over PVT</tspan></text>
