<text x="1162.0" y="170" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">6  Shared 6 GHz Gray TDC</text>
<text x="1073" y="190" font-size="9.6" text-anchor="start" fill="#1a1a1a" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="1073" dy="0">12-bit carry-select counter</tspan><tspan x="1073" dy="12.5">4 phase latches (24 GS/s)</tspan><tspan x="1073" dy="12.5">per-channel {gray, phase}</tspan><tspan x="1073" dy="12.5">freeze on fire · 64 channels</tspan></text>
<line x1="1260" y1="235.0" x2="1272" y2="235.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="1272" y="150" width="196" height="170" rx="8" fill="#e6f4ee" stroke="#1b7f5b" stroke-width="1.4"/>
<text x="1370.0" y="170" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">7  3-point calibration</text>
<text x="1281" y="190" font-size="9.6" text-anchor="start" fill="#1a1a1a" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="1281" dy="0">fixed-point Horner</tspan><tspan x="1281" dy="12.5">x_hat = C2·u² + C1·u + C0</tspan><tspan x="1281" dy="12.5">Q4.28 coeffs, Q2.16 out</tspan><tspan x="1281" dy="12.5">bit-exact RTL ↔ golden</tspan></text>
<text x="1370.0" y="310" font-size="9.5" text-anchor="middle" fill="#1b7f5b" font-weight="bold" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">→ x_hat → SS_READOUT readout</text>
