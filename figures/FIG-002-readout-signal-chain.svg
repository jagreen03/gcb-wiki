<text x="241" y="190" font-size="9.6" text-anchor="start" fill="#1a1a1a" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="241" dy="0">C_int = 2.0 pF, pre-charged</tspan><tspan x="241" dy="12.5">PD sinks current for 256 ns</tspan><tspan x="241" dy="12.5">V_FS = 568 mV; floor ≈ 0.2 V</tspan></text>
