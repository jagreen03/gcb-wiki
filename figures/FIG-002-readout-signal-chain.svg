<text x="760.0" y="450" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">PRELIMINARY CONCEPT — NO SILICON EXISTS</text>
<text x="12" y="492" font-size="9.5" text-anchor="start" fill="#54606b" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">Single-slope CIS readout signal chain. Analog parameters are ngspice/ASAP7 simulation results (BSIM-CMG for the ramp, BSIM4 surrogate for the comparator .noise); the digital back-end is verified bit-exact in Icarus. No silicon.</text>
