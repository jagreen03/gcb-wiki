<text x="657" y="190" font-size="9.6" text-anchor="start" fill="#1a1a1a" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="657" dy="0">2 stages · I_tail 30 µA</tspan><tspan x="657" dy="12.5">F_chop 20 MHz · C_L 0.8 pF</tspan><tspan x="657" dy="12.5">gated 20 ns on the</tspan><tspan x="657" dy="12.5">calibration-known crossing</tspan></text>
