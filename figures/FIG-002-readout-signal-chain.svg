<text x="20" y="50" font-size="11" text-anchor="start" fill="#54606b" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">Stage 4 of FIG-001 expanded. Dashed line = analog|digital boundary at the comparator latch.</text>
