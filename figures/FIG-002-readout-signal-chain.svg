<text x="1168.0" y="118" font-size="9.5" text-anchor="start" fill="#54606b" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">digital</text>
<rect x="642" y="106" width="208" height="30" rx="4" fill="#fbf1dc" stroke="#b8860b" stroke-width="1"/>
<text x="746.0" y="125" font-size="9.6" text-anchor="middle" fill="#7a5c00" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">total input-referred noise 53 µV (≤ 55 µV gate)</text>
