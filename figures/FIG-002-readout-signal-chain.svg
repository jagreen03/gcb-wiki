<text x="33" y="190" font-size="9.6" text-anchor="start" fill="#1a1a1a" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="33" dy="0">I_PD : 0.74 µA RMS,</tspan><tspan x="33" dy="12.5">4.45 µA FS (crest 6)</tspan></text>
<line x1="220" y1="235.0" x2="232" y2="235.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arw)"/>
