<text x="865" y="190" font-size="9.6" text-anchor="start" fill="#1a1a1a" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="865" dy="0">decision;</tspan><tspan x="865" dy="12.5">analog|digital</tspan><tspan x="865" dy="12.5">boundary here</tspan></text>
