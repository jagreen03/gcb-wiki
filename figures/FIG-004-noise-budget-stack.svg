<text x="560.0" y="572" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">PRELIMINARY CONCEPT — NO SILICON EXISTS</text>
<text x="12" y="614" font-size="9.3" text-anchor="start" fill="#54606b" font-weight="normal" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif">Comparator input-referred noise budget, 30 µA design point, RSS stack. sigma_thermal and sigma_1/f are ngspice .noise on a BSIM4 device gm-matched to ASAP7 (±16 %); sigma_latch is an assumed StrongARM value referred through the measured 2-stage gain. Verdict: CONDITIONAL GO pending a commercial transient-noise histogram.</text>
