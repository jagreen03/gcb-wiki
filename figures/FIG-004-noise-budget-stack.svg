<text x="824" y="291.57142857142856" font-size="8.6" text-anchor="start" fill="#54606b" font-family="'Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><tspan x="824" dy="0">decision-time-disqualified:</tspan><tspan x="824" dy="10">preamp τ ≈ 40 ns &gt; 30 ns</tspan><tspan x="824" dy="10">ramp window</tspan></text>
